name: Publish Custom Aether Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish to this fork's GHCR package
        required: true
        default: multipart-edit
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-custom-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/aether

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  gateway:
    name: Build gateway (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: custom-image-${{ matrix.target }}
          workspaces: . -> target

      - uses: taiki-e/install-action@cross

      - name: Compile release binary
        run: cross build --release --locked -p aether-gateway --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v5
        with:
          name: aether-gateway-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: [frontend, gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "${IMAGE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare Docker build context
        run: |
          mkdir -p dist
          cp artifacts/aether-gateway-amd64/aether-gateway dist/aether-gateway-amd64
          cp artifacts/aether-gateway-arm64/aether-gateway dist/aether-gateway-arm64
          chmod +x dist/aether-gateway-amd64 dist/aether-gateway-arm64
          cp -r artifacts/frontend-dist dist/frontend

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
