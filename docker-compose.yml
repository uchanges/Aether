# Aether 部署配置 - 使用外部共享数据库与 Redis
# 使用方法: docker compose up -d

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/fawney19/aether:latest}
    container_name: aether-app
    user: "0:0"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@${DB_HOST:-base-postgresql}:${DB_PORT:-5432}/${DB_NAME:-aether}
      REDIS_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST:-1panel-redis}:${REDIS_PORT:-6379}/0
      TZ: Asia/Shanghai
      AETHER_BASE_DIR: /opt/aether
      # This deployment runs a locally built image from this repository.
      # Keep releases under Git + deploy.sh control instead of pulling the
      # upstream official image from the admin console.
      AETHER_UPDATE_STRATEGY: manual
      AETHER_DOCKER_UPDATE_COMMAND: ${AETHER_DOCKER_UPDATE_COMMAND:-./update.sh}
      AETHER_LOG_DESTINATION: stdout
      AETHER_LOG_FORMAT: ${AETHER_LOG_FORMAT:-pretty}
      APP_PORT: ${APP_PORT:-8084}
      AETHER_GATEWAY_AUTO_PREPARE_DATABASE: ${AETHER_GATEWAY_AUTO_PREPARE_DATABASE:-true}
    ports:
      - "${APP_PORT:-8084}:${APP_PORT:-8084}"
    networks:
      - shared-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    restart: unless-stopped

networks:
  shared-network:
    name: 1panel-network
    external: true
